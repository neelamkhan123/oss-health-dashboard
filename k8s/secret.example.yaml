# Copy to k8s/secret.yaml (gitignored) and fill in real values:
#     cp k8s/secret.example.yaml k8s/secret.yaml
#
# This is the deployment's equivalent of .env. stringData lets you write
# plain values; Kubernetes base64-encodes them on the way in. A Secret is
# encoding, not encryption — treat the filled-in copy exactly the way you
# treat .env.
#
# Note what is NOT here: there is no JWT_SECRET. Sessions are opaque random
# tokens stored in Redis (services/auth.py), so there is nothing to sign.
apiVersion: v1
kind: Secret
metadata:
  name: oss-dashboard-secrets
type: Opaque
stringData:
  # --- Postgres, running in-cluster (see postgres.yaml) ---------------
  # The first three initialise the database container; DATABASE_URL is what
  # the app connects with. The user, password and database name have to
  # agree across all four values.
  POSTGRES_USER: "oss_dashboard"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "oss_dashboard"
  DATABASE_URL: "postgresql://oss_dashboard:CHANGE_ME@postgres:5432/oss_dashboard"

  # --- Redis, running in-cluster (see redis.yaml) ---------------------
  REDIS_URL: "redis://redis:6379/0"

  # --- GitHub sync ----------------------------------------------------
  # The sync worker's own PAT — unrelated to the OAuth apps below, which are
  # how *users* sign in. public_repo is enough to sync; the Watch button
  # additionally needs `repo`.
  GITHUB_TOKEN: "ghp_..."

  # --- OAuth providers (optional) -------------------------------------
  # Email + password sign-in works without these. OAuth needs a stable
  # callback URL, which an ephemeral public IP is not — see the deploy
  # scripts' notes on adding a free DuckDNS hostname if you want it.
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
