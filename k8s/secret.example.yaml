# Copy to k8s/secret.yaml (gitignored) and fill in real values:
#     cp k8s/secret.example.yaml k8s/secret.yaml
#
# This is the deployment's equivalent of .env. stringData lets you write
# plain values; Kubernetes base64-encodes them on the way in. Treat the
# filled-in copy exactly the way you treat .env — it is not encrypted at
# rest in etcd, it is only not-in-git.
#
# Note what is NOT here: there is no JWT_SECRET. Sessions are opaque random
# tokens stored in Redis (services/auth.py), so there is nothing to sign.
# POSTGRES_USER/PASSWORD/DB aren't here either — those configured the local
# Postgres container; RDS owns that now.
apiVersion: v1
kind: Secret
metadata:
  name: oss-dashboard-secrets
type: Opaque
stringData:
  # RDS endpoint. The database name at the end must match the "Initial
  # database name" set when the instance was created.
  DATABASE_URL: "postgresql://oss_dashboard:PASSWORD@RDS_ENDPOINT:5432/oss_dashboard"
  # ElastiCache primary endpoint. Use rediss:// (two s's) if you enabled
  # encryption in transit.
  REDIS_URL: "redis://ELASTICACHE_ENDPOINT:6379/0"
  # The sync worker's own PAT — unrelated to the OAuth apps below, which are
  # how *users* sign in. public_repo is enough for syncing; the Watch button
  # additionally needs `repo`.
  GITHUB_TOKEN: "ghp_..."
  # Production OAuth apps — separate from the localhost ones, since a GitHub
  # OAuth app takes a single callback URL. Register the callbacks as
  # https://<distribution>/api/auth/{github,google}/callback
  GITHUB_CLIENT_ID: "Ov23li..."
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: "....apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "GOCSPX-..."
