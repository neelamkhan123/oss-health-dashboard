# Non-secret runtime config. Safe to commit; real credentials live in
# secret.yaml, which is gitignored.
#
# FRONTEND_URL and API_BASE_URL both point at the *same* origin, because
# nginx in the web pod serves the SPA and proxies /api to the API (see
# web.yaml). That is what keeps the session cookie first-party.
#
# deploy/up.sh rewrites both to the instance's current address on every
# deploy — the public IP changes each time the stack is recreated, which is
# exactly why nothing else in the build knows it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oss-dashboard-config
data:
  FRONTEND_URL: "http://REPLACE_ME_HOST"
  API_BASE_URL: "http://REPLACE_ME_HOST"
  # false because the ephemeral deployment serves over plain HTTP on a bare
  # IP, where a Secure cookie would never be sent. Set both of these to
  # "true"/"lax" the moment you put TLS in front of it.
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "lax"
