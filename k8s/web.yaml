# The single entry point. nginx serves the built SPA and proxies /api to the
# api Service, so the browser sees one origin and the session cookie stays
# first-party — no CORS, no mixed content, and nothing that has to know the
# instance's public address.
#
# That last part is what makes the ephemeral deployment work: the public IP
# changes every time the stack is recreated, and neither this image nor the
# frontend bundle contains it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: REPLACE_ME_DOCKERHUB_USER/oss-dashboard-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests: { memory: "24Mi", cpu: "20m" }
            limits: { memory: "96Mi" }
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  # The only thing exposed outside the cluster. Postgres, Redis and the API
  # are all ClusterIP — reachable from other pods and nothing else.
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
