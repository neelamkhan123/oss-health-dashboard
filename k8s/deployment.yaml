# Three Deployments running the same image with different commands, plus the
# Service that exposes the API. This is the thing docker-compose.yml couldn't
# do: each rolls, scales and restarts independently.
#
# Replace REPLACE_ME_DOCKERHUB_USER throughout before applying. Build the
# image for the instance's architecture, not your laptop's:
#     docker buildx build --platform linux/amd64 \
#       -t <user>/oss-dashboard-api:latest --push backend/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: REPLACE_ME_DOCKERHUB_USER/oss-dashboard-api:latest
          # Required for `kubectl rollout restart` to actually pull a
          # freshly-pushed :latest instead of reusing the cached layer.
          imagePullPolicy: Always
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: oss-dashboard-secrets }
            - configMapRef: { name: oss-dashboard-config }
          resources:
            requests: { memory: "192Mi", cpu: "100m" }
            limits: { memory: "384Mi" }
          # The direct answer to the bug in PERFORMANCE.md where the api
          # container crash-looped for 26 hours while still reading "Up" in
          # docker ps: an unready pod gets no traffic, and `kubectl get pods`
          # shows 0/1 immediately.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: REPLACE_ME_DOCKERHUB_USER/oss-dashboard-api:latest
          imagePullPolicy: Always
          # --concurrency=2 is deliberate: Celery defaults to one process per
          # core, and each is a full interpreter with SQLAlchemy loaded. On a
          # 1 GB t3.micro the default will OOM the node.
          command:
            - celery
            - -A
            - app.services.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - secretRef: { name: oss-dashboard-secrets }
            - configMapRef: { name: oss-dashboard-config }
          resources:
            requests: { memory: "192Mi", cpu: "100m" }
            limits: { memory: "384Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels: { app: beat }
spec:
  # Must stay 1. A second beat replica double-fires every scheduled sync.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: beat }
  template:
    metadata:
      labels: { app: beat }
    spec:
      containers:
        - name: beat
          image: REPLACE_ME_DOCKERHUB_USER/oss-dashboard-api:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.services.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef: { name: oss-dashboard-secrets }
            - configMapRef: { name: oss-dashboard-config }
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits: { memory: "192Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  # NodePort rather than an Ingress: CloudFront can use a custom origin port
  # directly (30080 is inside its permitted 1024–65535 range), and it keeps
  # the mental model close to docker-compose's port mapping. k3s ships
  # Traefik if a cleaner setup is wanted later.
  type: NodePort
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
