server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so these can be cached hard. index.html must
    # not be, or a returning visitor gets HTML pointing at chunks that no
    # longer exist — the same failure an un-invalidated CDN produces.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The whole point of serving the frontend from inside the cluster: the
    # API is same-origin, so the session cookie is first-party, SameSite=Lax
    # keeps working, and there is no CORS and no mixed content to configure.
    location /api/ {
        # Variable upstream: resolved per request against the cluster DNS
        # (see docker-entrypoint.d/10-cluster-resolver.sh), not once at
        # startup. $request_uri keeps the original path, so /api/auth/me
        # arrives at the API as /api/auth/me.
        set $api_upstream http://api-service:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OAuth round trips come back as 302s to the provider and back again.
        proxy_redirect off;
        proxy_read_timeout 30s;
    }

    location = /health {
        set $health_upstream http://api-service:8000;
        proxy_pass $health_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # BrowserRouter: /compare and /repos/:id have no file on disk. Without
    # this they 404 on refresh and on any deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
