<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSS Health Dashboard</title>
    <script>
      // Applies the saved theme before the app's first paint, so a
      // dark-mode visitor never sees a flash of the light shell while
      // React boots and ThemeProvider's own effect catches up (see
      // src/lib/themeContext.tsx, which owns this logic from then on —
      // this copy exists only because that context isn't loaded yet).
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);

        // Same reasoning for the accent: without this the first paint uses
        // index.css's default blue and then snaps to the saved hue once
        // ThemeProvider's effect runs. Unvalidated on purpose — a junk
        // value simply matches no [data-accent] block, so the CSS falls
        // back to that same default; lib/accents.ts does the real
        // narrowing once it's loaded.
        var accent = localStorage.getItem("accent");
        if (accent) document.documentElement.dataset.accent = accent;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
