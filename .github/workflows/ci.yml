name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Not optional: sessions live in Redis, so every authenticated test
        # needs it, and `app.services.cache` is imported at app import time.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      # `Settings` declares github_token with no default, so the app fails to
      # import without one. Nothing in these tests calls GitHub, hence a dummy.
      # The name is fixed by pydantic-settings (field `github_token`), so this
      # does shadow the automatic Actions token inside this job — harmless
      # here, but worth knowing if a step here ever needs the real one.
      GITHUB_TOKEN: ci-dummy-token-not-used-by-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Migrations first — every DB-touching test hits a schema-less database
      # otherwise. alembic/env.py reads DATABASE_URL via app.config.
      - run: alembic upgrade head
      - run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  lighthouse:
    needs: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: frontend/dist
      # @lhci/cli is already a devDependency, so this runs the pinned copy
      # rather than downloading one. lighthouserc.json starts and stops the
      # preview server itself — no backgrounded server spanning two steps.
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci
          # .lighthouseci is a dotfile directory, and upload-artifact skips
          # hidden files unless told otherwise — without this the step
          # succeeds while uploading nothing.
          include-hidden-files: true
          retention-days: 7
