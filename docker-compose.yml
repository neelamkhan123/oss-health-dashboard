services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # A browser-based Postgres client — http://localhost:8080, server
  # "postgres" (the service name above, not localhost), then the same
  # POSTGRES_USER/PASSWORD/DB as everything else here. Dev convenience
  # only; nothing else in this stack talks to it.
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.services.celery_app worker --loglevel=info

  beat:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.services.celery_app beat --loglevel=info

volumes:
  pgdata:
